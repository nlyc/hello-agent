name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,rag]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Eval dataset dry-run
        run: python scripts/eval_v2.py --dry-run

      - name: Offline demos
        run: |
          python -m examples.demo_context_engineering --out .cache/ci_context
          python -m examples.demo_mcp_travel
          python -m examples.demo_a2a_travel --out .cache/ci_a2a
